name: Build NetLimiter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name for the APK'
        required: false
        default: '1.0-a11y'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 📦 Install apktool
        run: |
          APKTOOL_VERSION="2.11.0"
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" -O /usr/local/bin/apktool.jar
          echo '#!/bin/bash' | sudo tee /usr/local/bin/apktool
          echo 'java -jar /usr/local/bin/apktool.jar "$@"' | sudo tee -a /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool

      - name: 📦 Install Android SDK platform tools (aapt & apksigner)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk aapt zipalign
          mkdir -p ~/android-cmdline-tools
          cd ~/android-cmdline-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p latest
          mv cmdline-tools/* latest/
          yes | ./latest/bin/sdkmanager --install "build-tools;33.0.2" --sdk_root=$HOME/android-sdk 2>&1 | tail -3
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/build-tools/33.0.2" >> $GITHUB_PATH

      - name: 🔧 Update apktool.yml with current version
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name || '1.0-a11y' }}"
          sed -i "s/versionName:.*/versionName: '${VERSION_NAME}'/" apktool.yml
          echo "Using version: ${VERSION_NAME}"

      - name: 🔨 Build APK (unsigned)
        run: |
          apktool b . --output NetLimiter-unsigned.apk

      - name: 📐 Page-align native libraries (zipalign -p)
        run: |
          zipalign -p -f -v 4 NetLimiter-unsigned.apk NetLimiter-aligned.apk
          echo "✅ Page alignment done!"

      - name: 🔏 Decode keystore and sign APK
        run: |
          base64 -d keystore/netlimiter-release.keystore.b64 > netlimiter-release.keystore
          apksigner sign \
            --ks netlimiter-release.keystore \
            --ks-key-alias netlimiter \
            --ks-pass pass:netlimiter123 \
            --key-pass pass:netlimiter123 \
            --out NetLimiter-signed.apk \
            NetLimiter-aligned.apk
          echo "✅ APK signed successfully!"

      - name: 📱 Verify APK signature
        run: |
          apksigner verify --verbose NetLimiter-signed.apk

      - name: 📦 Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetLimiter-APK
          path: NetLimiter-signed.apk
          compression-level: 0

      - name: 📏 Check signed APK size
        run: |
          ls -lh NetLimiter-signed.apk
          echo "✅ Build complete! Signed & page-aligned APK is available."
