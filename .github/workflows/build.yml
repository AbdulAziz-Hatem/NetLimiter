name: Build NetLimiter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name for the APK'
        required: false
        default: '1.0-a11y'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 📦 Install apktool
        run: |
          APKTOOL_VERSION="2.11.0"
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" -O /usr/local/bin/apktool.jar
          echo '#!/bin/bash' | sudo tee /usr/local/bin/apktool
          echo 'java -jar /usr/local/bin/apktool.jar "$@"' | sudo tee -a /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool

      - name: 📦 Install Android SDK platform tools (aapt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk aapt zipalign
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV

      - name: 🔧 Update apktool.yml with current version
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name || '1.0-a11y' }}"
          sed -i "s/versionName:.*/versionName: '${VERSION_NAME}'/" apktool.yml
          echo "Using version: ${VERSION_NAME}"

      - name: 🔨 Build APK (unsigned)
        run: |
          apktool b . --output NetLimiter-unsigned.apk

      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetLimiter-APK
          path: NetLimiter-unsigned.apk
          compression-level: 0

      - name: 📏 Check APK size
        run: |
          ls -lh NetLimiter-unsigned.apk
          echo "✅ Build complete! Download the APK from the Artifacts section above."
